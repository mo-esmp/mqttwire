name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"
      # Packs both packages, which also checks that MqttWire.Server depends on exactly its own version of MqttWire.
      - run: dotnet pack src/MqttWire --no-build -c Release -o artifacts/packages
      - run: dotnet pack src/MqttWire.Server --no-build -c Release -o artifacts/packages
      # The same check where the manifest is somewhere else and NuGet normalizes the version ("0.2" is "0.2.0").
      - run: dotnet pack src/MqttWire.Server --no-build -c Release -o artifacts/pack-check -p:NuspecOutputPath=obj/pack-check -p:PackageVersion=0.2
      # For the publish job: the packages built and tested here are the ones published, with their symbol packages.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  interop-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/interop-js/package-lock.json
      - run: dotnet build tests/MqttWire.TestHost -c Release
      - run: npm ci
        working-directory: tests/interop-js
      - run: npm test
        working-directory: tests/interop-js

  # Publishes the packages of a version tag through Trusted Publishing: GitHub signs a token that names this repository
  # and this workflow, and nuget.org exchanges it for an API key that is valid for an hour, so no secret is stored. The
  # policy on nuget.org names the repository and this file; renaming either needs the policy updated.
  #
  # The job is separate so that only it may request the token: the other jobs run the code of pull requests. It runs
  # only once both of them pass.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dotnet, interop-js]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # lets the job request the token from GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A tag whose version is not the packages' would publish nothing new (--skip-duplicate) or the wrong version:
      # both packages must carry the tag's version, v0.1.0-preview.2 for 0.1.0-preview.2.
      - name: Check the packages' version against the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in MqttWire MqttWire.Server; do
            if [ ! -f "artifacts/$package.$version.nupkg" ]; then
              echo "::error::artifacts/$package.$version.nupkg is missing; the tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props."
              ls artifacts
              exit 1
            fi
          done

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: mo.esmp # the nuget.org profile name that owns the policy, not an email address

      # Pushes each .snupkg beside its .nupkg as well.
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
